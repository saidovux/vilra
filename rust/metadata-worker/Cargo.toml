[package]
name = "imgviewer-metadata-worker"
version = "0.1.0"
edition = "2021"

[dependencies]
tagimage-core = { path = "../crates/tagimage-core" }
tagimage-db = { path = "../crates/tagimage-db" }
dotenvy = "0.15"
tokio = { version = "1.40", features = ["rt-multi-thread", "macros", "time"] }
serde_json = "1"
rusqlite = { version = "0.40.0", features = ["bundled"] }

[dev-dependencies]
image = { version = "0.25", default-features = false, features = ["jpeg", "png", "webp"] }
tempfile = "3"
