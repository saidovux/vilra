[package]
name = "tagimage-db"
version = "0.1.0"
edition = "2021"

[dependencies]
tagimage-core = { path = "../tagimage-core" }
serde_json = "1"
rusqlite = { version = "0.40.0", features = ["bundled"] }
uuid = { version = "1", features = ["v4"] }
base64 = "0.22"
serde = { version = "1", features = ["derive"] }
unicase = "2.9"

[dev-dependencies]
tempfile = "3.27.0"
