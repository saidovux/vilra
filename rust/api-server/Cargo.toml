[package]
name = "imgviewer-api-server"
version = "0.1.0"
edition = "2021"

[dependencies]
axum = "0.7"
async-stream = "0.3"
base64 = "0.22"
chrono = { version = "0.4", features = ["serde"] }
dotenvy = "0.15"
futures-core = "0.3"
notify = "8.2"
notify-debouncer-full = "0.7"
rusqlite = { version = "0.40.0", features = ["bundled"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tagimage-db = { path = "../crates/tagimage-db" }
tagimage-core = { path = "../crates/tagimage-core" }
tokio = { version = "1.40", features = ["rt-multi-thread", "macros", "net", "sync"] }
tower-http = { version = "0.5", features = ["fs"] }
uuid = { version = "1", features = ["v4"] }

[dev-dependencies]
image = { version = "0.25", default-features = false, features = ["jpeg", "png", "webp"] }
tempfile = "3"
