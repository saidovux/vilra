[package]
name = "imgviewer-scanner-worker"
version = "0.1.0"
edition = "2021"

[dependencies]
tagimage-core = { path = "../crates/tagimage-core" }
tagimage-db = { path = "../crates/tagimage-db" }
dotenvy = "0.15"
rusqlite = { version = "0.40.0", features = ["bundled"] }
tokio = { version = "1.40", features = ["rt-multi-thread", "macros", "time"] }
serde_json = "1"
image = { version = "0.25", default-features = true, features = ["jpeg", "png", "webp"] }
uuid = { version = "1", features = ["v4"] }
