[package]
name = "vilra-desktop"
version = "0.1.1"
description = "Vilra local image gallery"
edition = "2021"

[build-dependencies]
tauri-build = { version = "2.5", features = [] }

[dependencies]
tagimage-db = { path = "../rust/crates/tagimage-db" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tauri = { version = "2.11", features = [] }
tauri-plugin-dialog = "2.7"
tauri-plugin-opener = "2"

[dev-dependencies]
tempfile = "3"
